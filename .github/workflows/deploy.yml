name: Update blog and deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 公開用フォルダを作成
        run: |
          mkdir -p _site
          cp index.html main.css blog.js _site/
          cp -R Image _site/Image

      - name: RSSから記事データを作成
        run: python3 scripts/fetch_blog.py _site/blog.json

      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: 公開ファイルを登録
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: GitHub Pagesへ公開
        uses: actions/deploy-pages@v4
